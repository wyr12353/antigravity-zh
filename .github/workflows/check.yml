name: selfcheck

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 是 README 声称的最低支持版本（源码里要求最高的 API 是
        # Path.is_relative_to，3.9 新增），光在文档里声称而不实际跑等于没验证；
        # 3.11 与 build-exe.yml 的打包环境保持一致。
        python-version: ["3.9", "3.11"]
    steps:
      # action 用 v5 / v6：这些版本起改用 Node 24 运行时；v4 / v5 那一代在 runner
      # 上会报 "Node.js 20 is deprecated ... being forced to run on Node.js 24"。
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v5
        with:
          # 这个是给测试用的 Node 运行时，不是 action 自身的。Node 20 已于
          # 2026-04 EOL，改用当前 LTS。
          node-version: "24"
      # 以下检查都不依赖已安装的 Antigravity 客户端
      - name: 提交前自检
        run: python tools/selfcheck.py

      # 138 条翻译用例：Python 模拟层 + 真实 Node 引擎层
      - name: 词典与规则回归
        run: python tools/verify.py --from-dict
