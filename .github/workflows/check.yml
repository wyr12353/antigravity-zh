name: selfcheck

on:
  push:
    # 只跟 main：不加过滤时打 tag 也会触发，而 build-exe.yml 已经在 tag 上
    # 跑过一遍 selfcheck，一次发版要白跑三遍。
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.9 是 README 声称的最低支持版本（源码里要求最高的 API 是
        # Path.is_relative_to，3.9 新增），光在文档里声称而不实际跑等于没验证；
        # 3.11 与 build-exe.yml 的打包环境保持一致。
        #
        # ubuntu-latest 已升到 26.04，actions/setup-python 没有对应的 3.9
        # 构建（报 "version '3.9' ... not found for Ubuntu 26.04"），所以
        # 最低版本这一格固定到仍有 3.9 的 24.04；3.11 继续跟 latest。
        include:
          - python-version: "3.9"
            os: ubuntu-24.04
          - python-version: "3.11"
            os: ubuntu-latest
    steps:
      # 各 action 统一到当前最新主版本（后续由 Dependabot 跟进）。
      # 早先的 v4 / v5 那一代跑在 Node 20 上，runner 会报
      # "Node.js 20 is deprecated ... being forced to run on Node.js 24"。
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v7
        with:
          # 这个是给测试用的 Node 运行时，不是 action 自身的。Node 20 已于
          # 2026-04 EOL，改用当前 LTS。
          node-version: "24"
      # 以下检查都不依赖已安装的 Antigravity 客户端
      - name: 提交前自检
        run: python tools/selfcheck.py

      # 用例数会随补译增长，别写死
      - name: 词典与规则回归
        run: python tools/verify.py --from-dict
