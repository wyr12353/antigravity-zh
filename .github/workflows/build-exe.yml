name: build-exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      # 各 action 统一到当前最新主版本（后续由 Dependabot 跟进）。
      # 早先的 v4 / v5 那一代跑在 Node 20 上，runner 会报
      # "Node.js 20 is deprecated ... being forced to run on Node.js 24"。
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          # 这里不能加 cache: pip。该选项要求仓库里存在 requirements.txt /
          # pyproject.toml 之类的依赖文件，而本项目是纯标准库、一个都没有，
          # 加上它会让 setup-python 直接报错并中断整个 workflow（Release 就产不出来了）。

      - name: 提交前自检
        run: python tools/selfcheck.py

      - name: 安装 PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller>=6.0,<7.0"

      # --noupx：UPX 压缩是杀软误报的重灾区
      # --add-data：inject/ 与 dict/ 内嵌进单文件，运行时解压到 sys._MEIPASS；
      #             missing 子命令还会用到 tools/scan_filter.py 的噪声判定
      - name: 打包单文件 exe
        run: >
          pyinstaller -F --noupx --name antigravity-zh
          --add-data "inject;inject" --add-data "dict;dict"
          --add-data "tools/scan_filter.py;tools"
          patcher.py

      # 必须断言退出码与输出：PowerShell 默认不会因外部命令非零退出而让 step 失败，
      # 否则 exe 缺 DLL 直接崩溃时这里照样"通过"。
      - name: 冒烟测试
        shell: pwsh
        run: |
          $out = & dist\antigravity-zh.exe --help 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "exe --help 退出码 $LASTEXITCODE" }
          if ($out -notmatch "patch" -or $out -notmatch "restore") {
            throw "exe --help 输出异常：$out"
          }

          # 再断言内嵌资源确实进了 exe。只测 --help 发现不了"词典漏打包"：
          # 那种 exe 照样能启动、帮助也正常，但汉化会彻底失效。
          # runner 上没装 Antigravity，status 会因找不到安装目录而失败，所以这里
          # 直接列出归档内容比对。
          #
          # 注意：archive_viewer 打印的是 Python repr，路径中的反斜杠是转义过的
          # 双反斜杠（'dict\\common.json'）。拿 'dict\common.json' 去做正则匹配
          # 永远匹配不上，所以这里只比对文件名。
          $list = python -m PyInstaller.utils.cliutils.archive_viewer -l dist\antigravity-zh.exe 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "无法读取 exe 归档：$list" }
          foreach ($f in @('common.json', 'ui_v2191.json', 'zh_runtime.js',
                           'zh_main_patch.js', 'scan_filter.py')) {
            if ($list -notmatch [regex]::Escape($f)) { throw "exe 内缺少内嵌资源：$f" }
          }
          Write-Host "冒烟测试通过"

      - name: 组装免安装包（exe + 外置词典，便于自行改词）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package | Out-Null
          Copy-Item dist\antigravity-zh.exe package\
          Copy-Item -Recurse dict package\dict
          Compress-Archive -Path package\* -DestinationPath dist\antigravity-zh-with-dict.zip

      # 这类工具会被杀软盯上，用户需要能验证下载完整性；checksum 与产物同发
      - name: 生成 SHA256 校验和
        shell: pwsh
        run: |
          Get-FileHash dist\antigravity-zh.exe, dist\antigravity-zh-with-dict.zip -Algorithm SHA256 |
            ForEach-Object { '{0}  {1}' -f $_.Hash.ToLower(), ($_.Path -replace '^.*\\', '') } |
            Out-File -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      # Release 说明的第一行写清适配的客户端版本：tag 即客户端版本，
      # 第四位补丁号表示工具自身的修复版本（见 README 的发版约定）
      - name: 生成 Release 兼容范围说明
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $parts = $tag.Split('.')
          $client = if ($parts.Count -ge 3) { $parts[0..2] -join '.' } else { $tag }
          "适配 Antigravity 客户端 $client。" |
            Out-File -Encoding utf8 release-notes.md
          "tag 中的第四位补丁号表示工具自身的修复版本；客户端更新后请到 Releases 页获取对应新版本。" |
            Out-File -Append -Encoding utf8 release-notes.md

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: antigravity-zh-windows-x64
          path: |
            dist/antigravity-zh.exe
            dist/antigravity-zh-with-dict.zip
            dist/SHA256SUMS.txt

      - name: 发布 Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          # 按 commit 自动生成发布说明，省得每次手写
          generate_release_notes: true
          body_path: release-notes.md
          files: |
            dist/antigravity-zh.exe
            dist/antigravity-zh-with-dict.zip
            dist/SHA256SUMS.txt
